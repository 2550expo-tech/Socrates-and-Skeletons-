# Publishes the web version of MindPay to GitHub Pages on every push to main:
#   https://2550expo-tech.github.io/Socrates-and-Skeletons-/
# The web version shows the app at phone width, works with real accounts and
# demo data, and reads slips from photos the user uploads. Scanning the whole
# gallery is only in the phone app. On iPhone: open in Safari -> Share ->
# Add to Home Screen, and it opens full screen with the MindPay icon.
name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Shared with the "MindPay ใหม่" deploy (branch v2): one deploy at a time, none cancelled.
concurrency:
  group: web-pages
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: App settings (public Supabase URL and publishable key)
        run: cp .env.example .env

      - name: Export web build
        env:
          EXPO_WEB_BASE_URL: /Socrates-and-Skeletons-
        run: npx expo export --platform web --output-dir dist

      - name: Home-screen icon and full-screen mode (iPhone "Add to Home Screen")
        env:
          EXPO_WEB_BASE_URL: /Socrates-and-Skeletons-
        run: node scripts/web-home-screen.mjs dist

      - name: Single-page app fallback for deep links
        run: cp dist/index.html dist/404.html

      - name: Unit tests
        run: npm test

      # Browser test of every sign-in path (sign up, email code, links, reset
      # password, sign out) against a local stand-in for Supabase. If anything
      # fails, the website is NOT published and the screenshots are attached.
      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests (sign-in flows)
        run: node e2e/web-auth.mjs dist e2e-shots

      - name: Keep screenshots when the browser tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-shots

      # The redesign "MindPay ใหม่" (branch v2) lives at /v2/ on the same site:
      # keep the copy already published there, and let its reloads find it.
      - name: Keep the new app at /v2/
        run: |
          if git fetch --depth=1 origin gh-pages:refs/remotes/origin/gh-pages && git ls-tree -d --name-only origin/gh-pages v2 | grep -qx v2; then
            git archive origin/gh-pages v2 | tar -x -C dist
            echo "kept /v2/"
          fi
          node scripts/route-v2.mjs dist

      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'Deploy web app'
