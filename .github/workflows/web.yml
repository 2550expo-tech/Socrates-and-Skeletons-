# Publishes the web version of MyPay to GitHub Pages:
#   https://2550expo-tech.github.io/mypay/
# Every push to main runs the unit and browser tests first; the site is only
# published when they pass.
# On iPhone: open the link in Safari -> Share -> Add to Home Screen, and it gets
# its own "MyPay" icon. MyPay shares accounts and data with MindPay (same Supabase).
name: Deploy web app (MyPay)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-pages
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: App settings (public Supabase URL and publishable key)
        run: cp .env.example .env

      - name: Unit tests
        run: npm test

      # The browser tests run on a build at the usual address (the test server serves that path).
      - name: Export a build for the browser tests
        env:
          EXPO_WEB_BASE_URL: /mypay
        run: |
          npx expo export --platform web --output-dir dist-test
          node scripts/web-home-screen.mjs dist-test
          cp dist-test/index.html dist-test/404.html

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: node e2e/web-auth.mjs dist-test e2e-shots

      - name: Keep screenshots when the browser tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-shots

      # The tested build is the one published (it was exported for /mypay/).
      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-test
          force_orphan: true
          commit_message: 'Deploy web app (MyPay)'
