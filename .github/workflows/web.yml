# Publishes the web version of "MindPay ใหม่" (the redesign on branch v2) to
# GitHub Pages under /v2/, next to the original MindPay at the site root:
#   https://2550expo-tech.github.io/Socrates-and-Skeletons-/v2/
# The original app at the root is kept exactly as it is: this job takes the
# published site, replaces only the /v2/ folder, and publishes it back.
# On iPhone: open the link in Safari -> Share -> Add to Home Screen, and it gets
# its own "MindPay ใหม่" icon next to the old one. Same accounts and data.
name: Deploy web app (MindPay ใหม่, /v2/)

on:
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: write

# Shared with the original app's deploy (branch main): one at a time, none cancelled.
concurrency:
  group: web-pages
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: App settings (public Supabase URL and publishable key)
        run: cp .env.example .env

      - name: Unit tests
        run: npm test

      # The browser tests run on a build at the usual address (the test server serves that path).
      - name: Export a build for the browser tests
        env:
          EXPO_WEB_BASE_URL: /Socrates-and-Skeletons-
        run: |
          npx expo export --platform web --output-dir dist-test
          node scripts/web-home-screen.mjs dist-test
          cp dist-test/index.html dist-test/404.html

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: node e2e/web-auth.mjs dist-test e2e-shots

      - name: Keep screenshots when the browser tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-v2
          path: e2e-shots

      - name: Export the build for /v2/
        env:
          EXPO_WEB_BASE_URL: /Socrates-and-Skeletons-/v2
        run: |
          npx expo export --platform web --output-dir dist-v2
          node scripts/web-home-screen.mjs dist-v2

      - name: Put it next to the original app
        run: |
          mkdir site
          git fetch --depth=1 origin gh-pages:refs/remotes/origin/gh-pages
          git archive origin/gh-pages | tar -x -C site
          # Never publish without the original app at the root.
          test -f site/index.html || { echo "The original app is missing from gh-pages: not publishing."; exit 1; }
          rm -rf site/v2
          cp -r dist-v2 site/v2
          node scripts/route-v2.mjs site
          ls site | head -30

      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          commit_message: 'Deploy web app (MindPay ใหม่ /v2/)'
